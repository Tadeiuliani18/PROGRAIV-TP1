<app-navbar [usuario]="usuario"></app-navbar>

<div class="page">
  <div class="login-box">
    <h2>Registro</h2>

    <form (ngSubmit)="register($event)">

      <div class="user-box">
        <input type="text" name="nombre" [(ngModel)]="nombre" required />
        <label>Nombre</label>
      </div>

      <div class="user-box">
        <input type="text" name="apellido" [(ngModel)]="apellido" required />
        <label>Apellido</label>
      </div>

      <div class="user-box">
        <input type="number" name="edad" [(ngModel)]="edad" required />
        <label>Edad</label>
      </div>

      <div class="user-box">
        <input type="email" name="email" [(ngModel)]="email" required />
        <label>Email</label>
      </div>

      <div class="user-box">
        <input type="password" name="password" [(ngModel)]="password" required />
        <label>Contraseña</label>
      </div>

      <div class="user-box">
        <input type="password" name="confirmPassword" [(ngModel)]="confirmPassword" required />
        <label>Confirmar Contraseña</label>
      </div>

      @if (error) {
      <p class="login-error">{{ error }}</p>
      }
      <button type="submit" class="submit-button">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        Registrarse
      </button>

    </form>
  </div>
</div>
