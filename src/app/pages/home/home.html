<div class="home-container">
    <section class="hero-section">
        <h1>Explora tu Sala de Juegos</h1>

    </section>
    <!-- Mensaje de error dinámico -->
     @if (mensajeError) {
        <div class="auth-error-toast">
            {{ mensajeError }}
        </div>
     }

    <section class="games-container">
        <app-game-card [color]="'#C8FF00'" [nombre]="'Ahorcado'" [descripcion]="'Advina la palabra y salva el día'"
            [imagen]="'/juego-del-ahorcado.png'" [ruta]="'/games/ahorcado'" (intentarJugar)="verificarYJugar($event)">
        </app-game-card>

        <app-game-card [color]="'#00FF9F'" [nombre]="'Mayor o Menor'" [descripcion]="'Mayor o menor y comotida día'"
            [imagen]="'/pngwing.com.png'" [ruta]="'/mayor-menor'" (intentarJugar)="verificarYJugar($event)">
        </app-game-card>

        <app-game-card [color]="'#FF9500'" [nombre]="'Preguntados'" [descripcion]="'Advina la palabra y quiz'"
            [imagen]="'/preguntados-juego.jpg'" [ruta]="'/preguntados'" (intentarJugar)="verificarYJugar($event)">
        </app-game-card>

        <app-game-card [color]="'#9D4EDD'" [nombre]="'Juego Propio'" [descripcion]="'Juego un puzzle'" [imagen]="'🚀'"
            [ruta]="'/juego-propio'" (intentarJugar)="verificarYJugar($event)">
        </app-game-card>
    </section>


</div>
